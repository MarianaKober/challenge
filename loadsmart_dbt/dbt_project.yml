name: "loadsmart_dbt"
version: "2.0.0"
config-version: 2
profile: "loadsmart_dbt"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  mileage_spread_threshold: 100   # miles; lane spread test and analysis
  outlier_lower_quantile: 0.01    # price outlier lower bound (percentile of non-zero values)
  outlier_upper_quantile: 0.99    # price outlier upper bound
  outlier_rate_warn_max: 0.04     # assert_price_outlier_rate warns above this share (and at 0%)
  outliers_mode: include          # include | exclude; used by analysis_lane_price_stats

models:
  loadsmart_dbt:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: analytics

seeds:
  loadsmart_dbt:
    +schema: staging